<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Orden de pago · NOVATECH</title>
<link rel="icon" href="assets/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--m:#7c3aed;--m2:#5b21b6;--t:#1f2937;--s:#6b7280;--b:#e5e7eb;--v:#059669}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--t);background:#f5f3fa;font-size:15px;line-height:1.55}
  .hoja{max-width:820px;margin:24px auto 40px;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 12px 36px rgba(46,16,101,.10)}
  header{padding:22px 32px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;border-bottom:5px solid var(--m)}
  .logo{height:78px}
  .tit{text-align:right}
  .tit h1{font-size:21px;color:var(--m2)}
  .tit p{color:var(--s);font-size:13px}
  .bloque{padding:22px 32px;border-bottom:1px solid var(--b)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}
  h3{font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--m);margin-bottom:8px}
  .k{color:var(--s)}
  table{width:100%;border-collapse:collapse}
  th,td{padding:10px 8px;border-bottom:1px solid var(--b);text-align:left;vertical-align:top}
  th{background:#f3edff;color:var(--m2);font-size:12px;text-transform:uppercase}
  .r{text-align:right;white-space:nowrap}
  .esp{color:var(--s);font-size:13px;white-space:pre-line;margin-top:3px}
  .totales{margin-left:auto;width:min(380px,100%);margin-top:12px}
  .totales div{display:flex;justify-content:space-between;padding:5px 0}
  .gran{font-weight:800;font-size:19px;border-top:2px solid var(--t);padding-top:9px!important}
  .pagar{display:block;text-align:center;background:var(--m);color:#fff;text-decoration:none;font-weight:800;font-size:18px;padding:16px;border-radius:12px;margin-top:6px}
  .pagar:hover{background:var(--m2)}
  .aviso{background:#fffbeb;color:#92400e;border-radius:10px;padding:12px 14px;font-size:14px}
  .vencida{background:#fef2f2;color:#991b1b}
  .nota{white-space:pre-line;font-size:14px;color:#374151}
  .acciones{max-width:820px;margin:0 auto 30px;padding:0 16px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .acciones button,.acciones a{background:#fff;border:1px solid var(--m);color:var(--m);border-radius:10px;padding:9px 16px;font-weight:700;cursor:pointer;text-decoration:none;font:inherit;font-weight:700}
  footer{text-align:center;color:var(--s);font-size:12px;padding:16px}
  .error{max-width:560px;margin:80px auto;text-align:center;background:#fff;padding:30px;border-radius:16px}
  @media(max-width:640px){.grid{grid-template-columns:1fr}.bloque,header{padding:18px}.tit{text-align:left}}
  @media print{body{background:#fff}.hoja{box-shadow:none;margin:0;border-radius:0}.acciones,.pagar{display:none!important}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>
<body>
<div id="app"></div>
<script>
  // La orden viaja dentro del enlace (después de #), así que no se guarda en ningún servidor.
  const $ = (tag, attrs = {}, ...hijos) => {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === 'class') el.className = v; else if (k === 'text') el.textContent = v; else el.setAttribute(k, v);
    }
    hijos.flat().forEach(h => h != null && el.append(h));
    return el;
  };
  const cop = n => '$' + Math.round(n).toLocaleString('es-CO') + ' COP';
  const usd = n => 'USD ' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  function leer() {
    const m = location.hash.match(/d=([^&]+)/);
    if (!m) return null;
    try {
      const b64 = m[1].replace(/-/g, '+').replace(/_/g, '/');
      const bin = atob(b64);
      return JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))));
    } catch (e) { return null; }
  }

  const o = leer();
  const app = document.getElementById('app');

  if (!o) {
    app.append($('div', { class: 'error' },
      $('img', { src: 'assets/novatech_logo.png', alt: 'NOVATECH', style: 'height:70px;margin-bottom:14px' }),
      $('h2', { text: 'Orden de pago no encontrada' }),
      $('p', { class: 'k', text: 'El enlace está incompleto. Pide a NOVATECH que te lo envíe de nuevo.' })));
  } else {
    const items = o.items || [];
    const sub = items.reduce((s, i) => s + (i.cant || 0) * (i.precio || 0), 0);
    const desc = o.descuento || 0;
    const total = Math.max(sub - desc, 0);
    const vencida = o.vence && new Date(o.vence + 'T23:59:59') < new Date();
    const linkOk = /^https:\/\//i.test(o.link || '');

    const filas = items.map(i => $('tr', {},
      $('td', {}, $('strong', { text: i.desc || '' }), i.esp ? $('div', { class: 'esp', text: i.esp }) : null),
      $('td', { class: 'r', text: String(i.cant || 0) }),
      $('td', { class: 'r', text: cop(i.precio || 0) }),
      $('td', { class: 'r', text: cop((i.cant || 0) * (i.precio || 0)) })));

    const totales = $('div', { class: 'totales' },
      $('div', {}, $('span', { text: 'Subtotal' }), $('span', { text: cop(sub) })),
      desc ? $('div', {}, $('span', { text: 'Descuento' }), $('span', { text: '−' + cop(desc) })) : null,
      $('div', { class: 'gran' }, $('span', { text: 'Total a pagar' }), $('span', { text: cop(total) })),
      o.trm ? $('div', { class: 'k' }, $('span', { text: `Equivalente aprox. (TRM ${o.trm.toLocaleString('es-CO')})` }), $('span', { text: usd(total / o.trm) })) : null);

    let pago;
    if (vencida) pago = $('div', { class: 'aviso vencida', text: 'Esta orden de pago está vencida. Escríbenos para generar una nueva.' });
    else if (linkOk) pago = [
      $('a', { class: 'pagar', href: o.link, target: '_blank', rel: 'noopener', text: o.boton || 'Pagar con tarjeta' }),
      $('p', { class: 'k', style: 'font-size:13px;margin-top:10px;text-align:center', text: 'Serás redirigido a la plataforma de pago segura. El monto aparece en pesos colombianos (COP); tu banco lo convierte automáticamente a tu moneda.' })];
    else pago = $('div', { class: 'aviso', text: 'El enlace de pago se enviará por separado.' });

    app.append(
      $('div', { class: 'hoja' },
        $('header', {},
          $('img', { class: 'logo', src: 'assets/novatech_logo.png', alt: 'NOVATECH' }),
          $('div', { class: 'tit' },
            $('h1', { text: 'Orden de pago' }),
            $('p', { text: `N.º ${o.numero || ''}` }),
            $('p', { text: `Fecha: ${o.fecha || ''}${o.vence ? ' · Válida hasta: ' + o.vence : ''}` }))),
        $('div', { class: 'bloque grid' },
          $('div', {}, $('h3', { text: 'De' }),
            $('p', {}, $('strong', { text: 'NOVATECH by Cosa Nova' })),
            $('p', { class: 'k', text: 'RIF: J-50399963-2' }),
            $('p', { class: 'k', text: 'novatech.cosanova@gmail.com · +57 300 188 5210' }),
            $('p', { class: 'k', text: 'somosnovatech.com' })),
          $('div', {}, $('h3', { text: 'Para' }),
            $('p', {}, $('strong', { text: o.cliente || '' })),
            o.contacto ? $('p', { class: 'k', text: o.contacto }) : null,
            o.dir ? $('p', { class: 'k', text: o.dir }) : null)),
        $('div', { class: 'bloque' }, $('h3', { text: 'Detalle' }),
          $('table', {}, $('thead', {}, $('tr', {}, $('th', { text: 'Concepto' }), $('th', { class: 'r', text: 'Cant.' }), $('th', { class: 'r', text: 'Valor unitario' }), $('th', { class: 'r', text: 'Total' }))),
            $('tbody', {}, filas)),
          totales),
        o.notas ? $('div', { class: 'bloque' }, $('h3', { text: 'Condiciones' }), $('div', { class: 'nota', text: o.notas })) : null,
        $('div', { class: 'bloque', style: 'border-bottom:0' }, $('h3', { text: 'Pago' }), pago)),
      $('div', { class: 'acciones' },
        $('button', { onclick: 'window.print()', text: 'Descargar PDF' }),
        $('a', { href: 'https://wa.me/573001885210?text=' + encodeURIComponent('Hola NOVATECH, tengo una pregunta sobre la orden de pago ' + (o.numero || '')), target: '_blank', rel: 'noopener', text: 'Preguntar por WhatsApp' })),
      $('footer', { text: 'NOVATECH · Desarrollo Web & Marketing Digital' }));
    document.title = `Orden de pago ${o.numero || ''} · NOVATECH`;
  }
</script>
</body>
</html>
