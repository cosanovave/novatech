<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Crear orden de pago · NOVATECH</title>
<link rel="icon" href="assets/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--m:#7c3aed;--m2:#5b21b6;--t:#1f2937;--s:#6b7280;--b:#e5e7eb}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--t);background:#f5f3fa;font-size:15px}
  .caja{max-width:860px;margin:24px auto 60px;padding:0 16px}
  .card{background:#fff;border-radius:16px;padding:22px 24px;margin-bottom:16px;box-shadow:0 8px 24px rgba(46,16,101,.06)}
  h1{font-size:22px;color:var(--m2);display:flex;align-items:center;gap:12px;margin-bottom:6px}
  h1 img{height:46px}
  h2{font-size:15px;color:var(--m);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  label{display:block;font-size:13px;font-weight:600;color:#374151;margin-bottom:4px}
  input,textarea{width:100%;font:inherit;border:1px solid var(--b);border-radius:10px;padding:9px 11px;background:#fff}
  input:focus,textarea:focus{outline:2px solid #c4b5fd;border-color:var(--m)}
  textarea{min-height:64px;resize:vertical}
  .item{border:1px solid var(--b);border-radius:12px;padding:12px;margin-bottom:10px;display:grid;grid-template-columns:2fr 1fr 1.3fr auto;gap:10px;align-items:start}
  .item .full{grid-column:1/-1}
  .quitar{background:none;border:0;color:#dc2626;font-size:18px;cursor:pointer;margin-top:24px}
  .btn{background:var(--m);color:#fff;border:0;border-radius:10px;padding:11px 18px;font-weight:700;cursor:pointer;font:inherit;font-weight:700}
  .btn.sec{background:#fff;color:var(--m);border:1px solid var(--m)}
  .fila{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .total{font-size:20px;font-weight:800;margin-top:6px}
  .k{color:var(--s);font-size:13px}
  #salida{word-break:break-all;background:#f3edff;border-radius:10px;padding:12px;font-size:13px;margin:10px 0;display:none}
  @media(max-width:640px){.grid{grid-template-columns:1fr}.item{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="caja">
  <div class="card">
    <h1><img src="assets/novatech_logo.png" alt="">Crear orden de pago</h1>
    <p class="k">Uso interno. Llena los datos, pega el link de pago (Nequi, Wompi o Bold) y comparte el enlace que se genera. La orden queda dentro del enlace: no se guarda en ningún servidor.</p>
  </div>

  <div class="card">
    <h2>Orden</h2>
    <div class="grid">
      <div><label>Número</label><input id="numero"></div>
      <div><label>Fecha</label><input id="fecha" type="date"></div>
      <div><label>Válida hasta (opcional)</label><input id="vence" type="date"></div>
      <div><label>TRM del día (COP por USD, opcional)</label><input id="trm" placeholder="3191.95"></div>
    </div>
  </div>

  <div class="card">
    <h2>Cliente</h2>
    <div class="grid">
      <div><label>Cliente / empresa</label><input id="cliente" placeholder="Total Tax LLC"></div>
      <div><label>Contacto</label><input id="contacto" placeholder="Shirley Moncada"></div>
    </div>
    <div style="margin-top:12px"><label>Dirección / ciudad (opcional)</label><input id="dir" placeholder="Frederick, MD, United States"></div>
  </div>

  <div class="card">
    <h2>Conceptos</h2>
    <div id="items"></div>
    <button class="btn sec" onclick="agregar()">+ Agregar concepto</button>
    <div class="grid" style="margin-top:14px">
      <div><label>Descuento en COP (opcional)</label><input id="descuento" placeholder="0" oninput="recalcular()"></div>
      <div><label>Total</label><div class="total" id="total">$0 COP</div><div class="k" id="totalUsd"></div></div>
    </div>
  </div>

  <div class="card">
    <h2>Condiciones y pago</h2>
    <label>Condiciones / notas para el cliente</label>
    <textarea id="notas" placeholder="Ej.: Anticipo del 50 %. El saldo se paga al entregar. Entrega en 3 semanas."></textarea>
    <div class="grid" style="margin-top:12px">
      <div><label>Link de pago (Nequi, Wompi o Bold)</label><input id="link" placeholder="https://..."></div>
      <div><label>Texto del botón</label><input id="boton" value="Pagar con tarjeta"></div>
    </div>
  </div>

  <div class="card">
    <div class="fila">
      <button class="btn" onclick="generar()">Generar enlace</button>
      <button class="btn sec" onclick="copiar()">Copiar enlace</button>
      <button class="btn sec" onclick="abrir()">Ver orden</button>
      <button class="btn sec" onclick="whatsapp()">Enviar por WhatsApp</button>
    </div>
    <div id="salida"></div>
    <p class="k" id="aviso"></p>
  </div>
</div>

<script>
  const num = v => {
    let t = String(v || '').trim().replace(/[^0-9.,]/g, '');
    if (t.includes(',')) t = t.replace(/\./g, '').replace(',', '.');
    else if ((t.match(/\./g) || []).length > 1 || /\.\d{3}$/.test(t)) t = t.replace(/\./g, '');
    return parseFloat(t) || 0;
  };
  const cop = n => '$' + Math.round(n).toLocaleString('es-CO') + ' COP';
  let enlace = '';

  function agregar(d = {}) {
    const div = document.createElement('div');
    div.className = 'item';
    div.innerHTML = `<div><label>Concepto</label><input class="desc" placeholder="Plan Pro · 12 meses"></div>
      <div><label>Cantidad</label><input class="cant" value="1"></div>
      <div><label>Valor unitario (COP)</label><input class="precio" placeholder="784000"></div>
      <button class="quitar" title="Quitar">✕</button>
      <div class="full"><label>Especificaciones (opcional)</label><textarea class="esp" placeholder="Qué incluye, entregables, alcance..."></textarea></div>`;
    div.querySelector('.desc').value = d.desc || '';
    div.querySelector('.esp').value = d.esp || '';
    if (d.precio) div.querySelector('.precio').value = d.precio;
    div.querySelector('.quitar').onclick = () => { div.remove(); recalcular(); };
    div.querySelectorAll('input').forEach(i => i.addEventListener('input', recalcular));
    document.getElementById('items').append(div);
    recalcular();
  }

  function datos() {
    const items = [...document.querySelectorAll('.item')].map(d => ({
      desc: d.querySelector('.desc').value.trim(),
      esp: d.querySelector('.esp').value.trim(),
      cant: num(d.querySelector('.cant').value),
      precio: num(d.querySelector('.precio').value),
    })).filter(i => i.desc || i.precio);
    const v = id => document.getElementById(id).value.trim();
    return {
      numero: v('numero'), fecha: v('fecha'), vence: v('vence'), trm: num(v('trm')) || 0,
      cliente: v('cliente'), contacto: v('contacto'), dir: v('dir'),
      items, descuento: num(v('descuento')), notas: v('notas'), link: v('link'), boton: v('boton'),
    };
  }

  function recalcular() {
    const o = datos();
    const total = Math.max(o.items.reduce((s, i) => s + i.cant * i.precio, 0) - o.descuento, 0);
    document.getElementById('total').textContent = cop(total);
    document.getElementById('totalUsd').textContent = o.trm ? 'Aprox. USD ' + (total / o.trm).toFixed(2) : '';
  }

  function generar() {
    const o = datos();
    const aviso = [];
    if (!o.cliente) aviso.push('Falta el cliente.');
    if (!o.items.length) aviso.push('Agrega al menos un concepto.');
    if (o.link && !/^https:\/\//i.test(o.link)) aviso.push('El link de pago debe empezar por https://');
    if (!o.link) aviso.push('Sin link de pago: la orden dirá que el link se enviará por separado.');
    const bytes = new TextEncoder().encode(JSON.stringify(o));
    const b64 = btoa(String.fromCharCode(...bytes)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    const base = location.href.replace(/orden-crear\.html.*$/, '');
    enlace = base + 'orden.html#d=' + b64;
    const s = document.getElementById('salida');
    s.style.display = 'block';
    s.textContent = enlace;
    document.getElementById('aviso').textContent = aviso.join(' ');
    return enlace;
  }
  function copiar() { const e = enlace || generar(); navigator.clipboard.writeText(e).then(() => alert('Enlace copiado')); }
  function abrir() { window.open(enlace || generar(), '_blank'); }
  function whatsapp() {
    const e = enlace || generar();
    const t = `Hola${datos().contacto ? ' ' + datos().contacto : ''}, te comparto la orden de pago de NOVATECH con el detalle y el botón para pagar con tarjeta:\n${e}`;
    window.open('https://wa.me/?text=' + encodeURIComponent(t), '_blank');
  }

  // Número sugerido NT-OP-AAAA-001 (se recuerda en este navegador) y fecha de hoy.
  const hoy = new Date().toISOString().slice(0, 10);
  document.getElementById('fecha').value = hoy;
  let n = 1;
  try { n = (parseInt(localStorage.getItem('nt-op-ultimo') || '0', 10) || 0) + 1; } catch (e) {}
  document.getElementById('numero').value = `NT-OP-${hoy.slice(0, 4)}-${String(n).padStart(3, '0')}`;
  const guardarNumero = () => { const m = document.getElementById('numero').value.match(/(\d+)$/); try { if (m) localStorage.setItem('nt-op-ultimo', m[1]); } catch (e) {} };
  document.querySelector('.btn').addEventListener('click', guardarNumero);
  agregar();
</script>
</body>
</html>
